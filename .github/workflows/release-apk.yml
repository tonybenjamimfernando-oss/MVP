name: Build Android APK for installation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-apk:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Debug APKs are automatically signed with Android's debug key.
      # This intentionally avoids depending on the currently invalid release keystore secret.
      - name: Build installable debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd android
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -s "$APK_PATH" ]; then
            echo "::error::Expected debug APK was not generated at $APK_PATH"
            find android -type f -name '*.apk' -print || true
            exit 1
          fi
          mkdir -p release-artifacts
          cp "$APK_PATH" release-artifacts/MVP-debug.apk
          echo "path=release-artifacts/MVP-debug.apk" >> "$GITHUB_OUTPUT"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: MVP-android-debug-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14
